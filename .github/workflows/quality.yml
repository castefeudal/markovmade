name: Quality

on:
  push:
    branches: [main, codex/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    name: Browser, visual and accessibility QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:a11y
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: markovmade-browser-evidence
          path: |
            test-results/visual/
            test-results/contracts/
            test-results/accessibility/
          if-no-files-found: ignore
          retention-days: 14

  performance:
    name: Lighthouse mobile and desktop diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:lighthouse
        env:
          LIGHTHOUSE_MATRIX: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: markovmade-lighthouse-reports
          path: test-results/lighthouse/
          if-no-files-found: ignore
          retention-days: 14
