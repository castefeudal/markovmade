name: Quality

on:
  push:
    branches: [main, codex/**]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_visual_baselines:
        description: Capture Linux contract screenshots for visual review
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}${{ inputs.refresh_visual_baselines && '-visual' || '' }}
  cancel-in-progress: true

jobs:
  unit:
    if: github.event_name != 'workflow_dispatch' || !inputs.refresh_visual_baselines
    name: Unit and source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  browser:
    if: github.event_name != 'workflow_dispatch' || !inputs.refresh_visual_baselines
    name: Browser, visual and accessibility QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:a11y
      - run: npm run test:visual
      - run: npm run test:paint
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: markovmade-browser-evidence
          path: |
            test-results/visual/
            test-results/contracts/
            test-results/services/
            test-results/accessibility/
            test-results/ultimate/
            test-results/lab-pro/
            test-results/flagship/
            test-results/text-reflow/
          if-no-files-found: ignore
          retention-days: 14

  performance:
    if: github.event_name != 'workflow_dispatch' || !inputs.refresh_visual_baselines
    name: Lighthouse mobile and desktop diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:lighthouse
        env:
          LIGHTHOUSE_MATRIX: 1
          LIGHTHOUSE_RUNS: 3
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: markovmade-lighthouse-reports
          path: test-results/lighthouse/
          if-no-files-found: ignore
          retention-days: 14

  visual_candidates:
    name: Linux visual candidates - review required
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_visual_baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      # Capture deliberately fails until the images have been reviewed and committed.
      - run: npm run test:visual
        env:
          CAPTURE_VISUAL_CANDIDATES: 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: markovmade-linux-candidates
          path: test-results/contracts/
          if-no-files-found: error
          retention-days: 14
