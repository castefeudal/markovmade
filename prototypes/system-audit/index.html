<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARKOVMADE System Audit</title><style>body{margin:0;background:#0b0b0b;color:#eee;font-family:Arial,sans-serif}main{max-width:760px;margin:auto;padding:32px 18px}.brand{color:#d4af37;font-weight:800}.card{background:#171717;border:1px solid #333;border-radius:18px;padding:22px;margin:18px 0}h1{font-size:52px}button{background:#d4af37;border:0;border-radius:12px;padding:14px 18px;font-weight:800}.opt{display:block;width:100%;margin:9px 0;text-align:left;background:#222;color:#eee;border:1px solid #444}.hidden{display:none}.score{font-size:42px;color:#d4af37;font-weight:900}</style></head><body><main><div class="brand">MARKOVMADE</div><h1>System Audit</h1><p>3 минуты. Найди одно ограничение. Контакты до результата не нужны.</p><div id="quiz" class="card"></div><div id="result" class="card hidden"></div></main><script>const qs=[['Ясность','Один результат на 7 дней понятен?'],['Старт','Нужное действие легко начать?'],['Среда','Среда помогает действовать?'],['Обратная связь','Есть понятная обратная связь?'],['Возврат','Есть минимум на плохой день?']];let i=0,a=[];const src=new URLSearchParams(location.search).get('src')||new URLSearchParams(location.search).get('utm_source')||'direct';function draw(){quiz.innerHTML='<h2>'+qs[i][0]+'</h2><p>'+qs[i][1]+'</p>'+[1,2,3,4,5].map(x=>'<button class="opt" onclick="pick('+x+')">'+x+'</button>').join('')}function pick(x){a.push(x);if(++i<5)draw();else finish()}function finish(){quiz.classList.add('hidden');let k=a.indexOf(Math.min(...a));let names=['ясность цели','трение старта','среда','обратная связь','возврат'];result.classList.remove('hidden');result.innerHTML='<div class="score">'+a.reduce((s,x)=>s+x,0)+'/25</div><h2>Главное ограничение: '+names[k]+'</h2><p>Исправь одно слабое звено 7 дней. Красный минимум: ≤15 минут.</p><small>source: '+src+' · не медицинская/психологическая диагностика</small>'}draw();</script></body></html>
